[project]
name = "tg-scribe"
version = "0.1.0"
description = "Local MCP server that gives AI agents access to your Telegram account on macOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "telethon",
    "mcp",
    "pyobjc-framework-vision>=13.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=13.0 ; sys_platform == 'darwin'",
    "segno>=1.6.6",
    "python-socks[asyncio]>=3.2.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
